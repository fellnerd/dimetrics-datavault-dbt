version: 2

seeds:
  - name: ref_role
    description: Referenzdaten für Unternehmens-Rollen (Client, Contractor, Supplier)
    config:
      schema: vault
    columns:
      - name: role_code
        description: Business Key - Eindeutiger Rollen-Code
        data_tests:
          - unique
          - not_null
      - name: role_name
        description: Anzeigename der Rolle
      - name: role_description
        description: Beschreibung der Rolle

  - name: lead_engine_ort_alias
    description: "Alias-Ortsnamen der Lead-Engine: Schreibweisen, Regionen und Mehrfachangaben, die ref_lead_engine__ort nicht kennt (name_norm nach der Normalisierung in bv_stelle_merkmale). bundesland 'mehrere' = landesweit/mehrere Bundeslaender; ist_remote = 1 fuer Ortsangaben wie Homeoffice."
    config:
      schema: seed
      column_types:
        name_norm: nvarchar(200)
        bundesland: nvarchar(100)
        bemerkung: nvarchar(200)
    columns:
      - name: name_norm
        description: "Ortsname klein und normalisiert (ohne Zusatz nach Komma/Klammer, ohne fuehrende PLZ, Wien-Bezirke als 'wien', ohne Vorsatz Grossraum/Raum/Naehe/Bezirk und ohne Zusatz 'stadt'/'umgebung')."
        data_tests: [unique, not_null]
      - name: bundesland
        description: "Bundesland, 'mehrere' (landesweit oder mehrere Bundeslaender) oder leer (kein Bundesland, z. B. weltweit)."
      - name: ist_remote
        description: "1 = Ortsangabe bedeutet Remote/Homeoffice."
      - name: bemerkung
        description: "Art des Eintrags."

  - name: lead_engine_gewicht_startwerte
    description: "Startwerte der Vorscore-Gewichte (bereich, schluessel, punkte); die Gewichte aus der Landing-Quelle suchprofil ueberschreiben sie je (bereich, schluessel), siehe ref_lead_engine__gewicht."
    config:
      schema: seed
      column_types:
        bereich: nvarchar(50)
        schluessel: nvarchar(100)
        bemerkung: nvarchar(300)

  - name: lead_engine_regel
    description: "Begriffslisten der Vorscore-Regeln: vermittler_firma/vermittler_text (Personalvermittlung), titel_abschlag (Einsteiger im Titel), fremd_system (fremde Systeme), ms_signal (Microsoft-Stack als Datensignal). modus: wort (ganzes Wort), prefix (Wortanfang), enthaelt (Teilzeichenkette; Firmenname bzw. Text)."
    config:
      schema: seed
      column_types:
        regel: nvarchar(50)
        begriff: nvarchar(200)
        modus: nvarchar(20)
        bemerkung: nvarchar(200)
    columns:
      - name: regel
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [vermittler_firma, vermittler_text, titel_abschlag, fremd_system, ms_signal]
      - name: begriff
        data_tests: [not_null]
      - name: modus
        data_tests:
          - accepted_values:
              arguments:
                values: [wort, prefix, enthaelt]

  - name: lead_engine_thema_ergaenzung
    description: "Ergaenzende Begriffe der Bewertung (zusaetzlich zu den Themen aus der Landing-Quelle suchprofil): thema, gewicht (Negativ: negativ), nur_titel, aktiv. Ein Begriff aus suchprofil hat Vorrang vor dem Seed."
    config:
      schema: seed
      column_types:
        begriff: nvarchar(200)
        thema: nvarchar(100)
    columns:
      - name: begriff
        data_tests: [unique, not_null]
      - name: thema
        data_tests: [not_null]
