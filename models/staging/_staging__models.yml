version: 2

models:
  - name: stg_lead_engine__karriere_stelle
    description: "Staging karriere.at (Lead-Engine): eine Zeile je Lauf und Anzeigen-ID. BK Stelle stelle_bk, BK Firma firma_bk."
    columns: &stg_stelle_columns
      - name: hk_stelle
        description: "Hash Key Stelle (collision_code, stelle_bk)"
        data_tests: [not_null]
      - name: hk_firma
        description: "Hash Key Firma (collision_code, firma_bk)"
        data_tests: [not_null]
      - name: hk_link_stelle_firma
        data_tests: [not_null]
      - name: stelle_bk
        description: "Business Key Stelle"
        data_tests: [not_null]
      - name: firma_bk
        description: "Business Key Firma ('-1' = anonym/unbekannt)"
        data_tests: [not_null]
      - name: dss_business_key
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [run_id, stelle_bk]

  - name: stg_lead_engine__theirstack_stelle
    description: "Staging TheirStack (Lead-Engine): eine Zeile je Lauf und Anzeigen-ID (id als Text)."
    columns: *stg_stelle_columns
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [run_id, stelle_bk]

  - name: stg_lead_engine__website_stelle
    description: "Staging Firmenwebsites (Lead-Engine): eine Zeile je Lauf, Firma und normalisiertem Titel. BK Stelle = Domain|Titel."
    columns: *stg_stelle_columns
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [run_id, stelle_bk]

  - name: stg_lead_engine__karriere_stelle__firma
    description: "FK-Staging: Firma aus karriere-Anzeigen (dss_business_key der Firma), je Firma und Lauf dedupliziert."
    columns: &stg_firma_columns
      - name: hk_firma
        data_tests: [not_null]
      - name: firma_bk
        data_tests: [not_null]
      - name: dss_business_key
        data_tests: [not_null]

  - name: stg_lead_engine__theirstack_stelle__firma
    description: "FK-Staging: Firma aus TheirStack-Anzeigen (dss_business_key der Firma), je Firma und Lauf dedupliziert."
    columns: *stg_firma_columns

  - name: stg_lead_engine__website_stelle__firma
    description: "FK-Staging: Firma (Domain) aus Website-Anzeigen."
    columns: *stg_firma_columns

  - name: base_lead_engine__karriere_stelle
    description: "Base-View: OPENJSON-Zerlegung des karriere-Payloads, dedupliziert je Lauf und Anzeigen-ID."
  - name: base_lead_engine__theirstack_stelle
    description: "Base-View: OPENJSON-Zerlegung des TheirStack-Payloads, dedupliziert je Lauf und Anzeigen-ID."
  - name: base_lead_engine__website_stelle
    description: "Base-View: Website-Payload, dedupliziert je Lauf, Domain und normalisiertem Titel."
  - name: base_lead_engine__lauf_abfrage
    description: "Monitoring: eine Zeile je Lauf und Abfrage aus dem Laufprotokoll (items gegen total_reported, truncated, error)."

  - name: stg_lead_engine__freelancer_stelle
    description: "Staging freelancer.at (Lead-Engine): Auftrag je Lauf aus Liste + Detail, nur neue Läufe (Delta). BK Stelle stelle_bk = Auftrags-ID, kein Firmen-Hub (Auftraggeber unbekannt)."
    columns:
      - name: hk_stelle
        data_tests: [not_null]
      - name: stelle_bk
        data_tests: [not_null]
      - name: dss_business_key
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [run_id, stelle_bk]

  - name: base_lead_engine__freelancer_liste
    description: "Base-Tabelle (incremental): Aufträge der Listenseiten (query_id liste), eine Zeile je Lauf und Auftrags-ID, inkl. profil_ids aus profil_treffer."
  - name: base_lead_engine__freelancer_auftrag
    description: "Base-Tabelle (incremental): Detaildateien (query_id details), eine Zeile je Lauf und Auftrags-ID, mit voller Beschreibung und Kategorie."
  - name: base_lead_engine__freelancer_stelle
    description: "Base-View: Liste + jüngstes Detail (bis zu diesem Lauf) je Lauf und Auftrags-ID."
  - name: base_lead_engine__freelancer_stelle_delta
    description: "Delta-View: nur Läufe, die der Vault noch nicht verarbeitet hat (Wasserstand: Sichtungs-Satellit freelancer)."
  - name: base_lead_engine__karriere_stelle_delta
    description: "Delta-View: nur Läufe, die der Vault noch nicht verarbeitet hat."
  - name: base_lead_engine__theirstack_stelle_delta
    description: "Delta-View: nur Läufe, die der Vault noch nicht verarbeitet hat."
  - name: base_lead_engine__website_stelle_delta
    description: "Delta-View: nur Läufe, die der Vault noch nicht verarbeitet hat."

  - name: stg_lead_engine__firmenprofil_firma
    description: "Staging Firmenprofil (Lead-Engine): Firma je Lauf und Quelle der Firma (Kollisionscode = quelle). Speist hub_firma und sat_firma__firmenprofil."
    columns:
      - name: hk_firma
        data_tests: [not_null]
      - name: firma_bk
        data_tests: [not_null]
      - name: dss_business_key
        data_tests: [not_null]
  - name: base_lead_engine__firmenprofil
    description: "Base-Tabelle (incremental): Firmenprofile (source firmenprofil), eine Zeile je Lauf, Quelle und company_id."

  - name: stg_lead_engine__adzuna_stelle
    description: "Staging Adzuna (Lead-Engine): Anzeige je Lauf, nur neue Läufe (Delta). BK Stelle = Adzuna-ID, BK Firma = normierter Firmenname ('-1' ohne Namen)."
    columns: *stg_stelle_columns
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [run_id, stelle_bk]
  - name: stg_lead_engine__adzuna_stelle__firma
    description: "FK-Staging: Firma aus Adzuna-Anzeigen (normierter Name), je Firma und Lauf dedupliziert."
    columns: *stg_firma_columns
  - name: base_lead_engine__adzuna_stelle
    description: "Base-Tabelle (incremental): Adzuna-Anzeigen aus payload.results, eine Zeile je Lauf und Anzeigen-ID, query_ids/profil_ids je Lauf."
  - name: base_lead_engine__adzuna_stelle_delta
    description: "Delta-View: nur Läufe, die der Vault noch nicht verarbeitet hat."
