version: 2

models:
  - name: dim_quelle
    description: "Dimension Quelle (karriere.at, TheirStack, Firmenwebsite). 1 Zeile je Quelle + Unbekannt-Zeile."
    columns:
      - name: quelle_key
        data_type: BIGINT
        data_tests: [not_null, unique]
      - name: quelle_code
        data_tests: [not_null]
      - name: quelle_name
        data_tests: [not_null]

  - name: dim_firma
    description: "Dimension Firma. 1 Zeile je Firma und Quelle, Unbekannt-Zeile -1. Firmen quellenübergreifend noch nicht zusammengeführt (Same-as-Link folgt)."
    columns:
      - name: firma_key
        data_type: BIGINT
        data_tests: [not_null, unique]
      - name: firma_id
        data_tests: [not_null]
      - name: firma_code
        data_tests: [not_null]
      - name: firma_name
        data_tests: [not_null]

  - name: dim_stelle
    description: "Dimension Stelle (Anzeige), aktueller Stand je Stelle und Quelle. Firma nur als Attribut (kein firma_key)."
    columns:
      - name: stelle_key
        data_type: BIGINT
        data_tests: [not_null, unique]
      - name: stelle_id
        data_tests: [not_null]
      - name: stelle_code
        data_tests: [not_null]
      - name: stelle_name
        data_tests: [not_null]

  - name: fakt_stelle_sichtung
    description: "Fakt: 1 Zeile je Stelle, Lauf und Suchprofil (Sichtung). Measures anzahl_sichtungen, anzahl_abfragen. profil_id = Suchprofil (degenerierte Dimension); anzahl_sichtungen nur je profil_id summieren."
    columns:
      - name: profil_id
        description: "Suchprofil aus der Suchprofil-Tabelle (z. B. data-bi, online-marketing); vor 25.10.2026 = data-bi."
        data_tests:
          - not_null
      - name: stelle_key
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_stelle'), field: stelle_key}}
      - name: firma_key
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_firma'), field: firma_key}}
      - name: quelle_key
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_quelle'), field: quelle_key}}
      - name: datum_key
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_date'), field: date_key}}

  - name: fakt_stelle
    description: "Fakt: 1 Zeile je Stelle und Quelle (Lebenszyklus). datum_key = erste Sichtung, ist_online = im jüngsten Lauf der Quelle noch gefunden."
    columns:
      - name: stelle_key
        data_tests:
          - not_null
          - unique
          - relationships: {arguments: {to: ref('dim_stelle'), field: stelle_key}}
      - name: firma_key
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_firma'), field: firma_key}}
      - name: quelle_key
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_quelle'), field: quelle_key}}
      - name: datum_key
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_date'), field: date_key}}
      - name: zuletzt_gesehen_datum_key
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_date'), field: date_key}}

  - name: dim_quelle_v
    description: "Publizierte View auf dim_quelle."
  - name: dim_firma_v
    description: "Publizierte View auf dim_firma."
  - name: dim_stelle_v
    description: "Publizierte View auf dim_stelle."
  - name: fakt_stelle_sichtung_v
    description: "Publizierte View auf fakt_stelle_sichtung."
  - name: fakt_stelle_v
    description: "Publizierte View auf fakt_stelle."

  - name: lead_kandidaten_v
    description: |
      Publizierte View: 1 Zeile je Firma mit Sichtung in den letzten 60 Tagen (Suchprofil-Treffer, ohne Vermittler), mit Anzahl Stellen
      (30/60 Tage), Quellen, Profilen, erster/letzter Sichtung und den Stellentiteln. Dieselbe Firma aus mehreren Quellen erscheint
      mehrfach, bis ein Same-as-Link existiert. Offen: ist_gesperrt, Firmenbuch-Felder.
    columns:
      - name: firma_key
        data_tests: [not_null, unique]
      - name: firma_name
        data_tests: [not_null]
      - name: anzahl_stellen_60t
        data_tests: [not_null]

  - name: lead_gelegenheiten
    description: |
      Tabelle (Tageslauf) hinter lead_gelegenheiten_v und lead_ki_offen_v: dieselben Spalten ohne ki_*, zusätzlich master_firma_bk, firma_id und
      inhalt_geaendert_am. Wird nicht direkt abgefragt (der MCP liest die Views).
    columns:
      - name: gelegenheit_id
        data_tests: [not_null, unique]
      - name: vorscore
        data_tests: [not_null]

  - name: lead_firmen
    description: |
      Tabelle (Tageslauf) hinter lead_firmen_v und lead_ki_offen_v: dieselben Spalten ohne ki_*, zusätzlich groessenklasse_code. Wird nicht direkt
      abgefragt (der MCP liest die Views).
    columns:
      - name: firma_id
        data_tests: [not_null, unique]
      - name: bester_vorscore
        data_tests: [not_null]

  - name: lead_gelegenheiten_v
    description: |
      Tagesliste der Lead-Engine: 1 Zeile je Gelegenheit (dieselbe Stelle aus mehreren Quellen ist zu einer Zeile zusammengefasst), veröffentlicht
      oder zuletzt gesehen in den letzten 30 Tagen, ohne Festanstellung über Vermittler und ohne gesperrte oder bereits bearbeitete Leads.
      Sortieren nach vorscore absteigend. Blättern über gelegenheit_id (varchar, eindeutig).
    columns:
      - name: gelegenheit_id
        description: "Eindeutiger Schlüssel der Gelegenheit (Text, stabil). Zum Blättern und für den Lead-Status im Suchprofil verwenden."
        data_tests: [not_null, unique]
      - name: gelegenheit_key
        description: "Zweiter eindeutiger Schlüssel als Text (Hash von gelegenheit_id); nur für Verbindungen zu älteren Abfragen, sonst gelegenheit_id nehmen."
        data_tests: [not_null, unique]
      - name: lead_typ
        description: "Art des Leads: A1 Auftrag auf freelancer.at | A2 Projekt über Vermittler (freiberuflich/projekt/befristet) | A3 öffentliche Ausschreibung (TED) | B1 Firmenstelle mit Überbrückungsbedarf (Interim, Karenz, befristet, lange offen) | B2 sonstige Firmenstelle (Festanstellung als Bedarfssignal) | C Partner (IT-Dienstleister/Beratung sucht Fachleute, Subunternehmer)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['A1', 'A2', 'A3', 'B1', 'B2', 'C']
      - name: vorscore
        description: "Vorbewertung 0–100 (Summe der Bausteine p_thema bis p_abzug; kann durch Abzüge unter 0 fallen, Minimum -25). Ab ca. 55 für die Tagesliste interessant (A ab 55, B ab 60, C ab 50)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: -25
                max_value: 100
      - name: p_thema
        description: "Baustein Thema, 0–35: Passung zu den Kernthemen (Datenplattform, BI und Reporting, KI, Controlling); Treffer im Titel zählen doppelt. Ohne Kernthema im Titel höchstens 20."
      - name: p_typ
        description: "Baustein Lead-Typ (A1 25, A2/A3 20, B1/C 15, B2 8). 0, wenn kein Kernthema im Titel trifft oder ein Negativbegriff im Titel steht."
      - name: p_region
        description: "Baustein Region, 0–20 (Kärnten und remote 20, Steiermark/Salzburg/Osttirol 15, übrige Bundesländer 6–8, DACH 3, unbekannt 5; hybrid +4 bei unter 10). 0 ohne Kernthema im Titel."
      - name: p_frische
        description: "Baustein Frische, 0–15: bis 3 Tage nach Veröffentlichung 15, bis 7 Tage 12, bis 14 Tage 8, bis 30 Tage 4, älter 0."
      - name: p_passung
        description: "Baustein Passung, 0–5: Stundensatz ab 60 EUR oder Budget genannt (+3), Firmengröße 20–500 Mitarbeiter oder Größenklasse klein/mittel laut Jahresabschluss (+2)."
      - name: p_bonus
        description: "Baustein Bonus, bis +15: lange offen (über 45 Tage) oder neu ausgeschrieben +5, höchstens 3 Reaktionen (freelancer.at) +5, zweite relevante Gelegenheit derselben Firma in 60 Tagen +5."
      - name: p_abzug
        description: "Baustein Abzug, bis -25: Konzern oder Konzerntochter -10, Negativbegriff im Titel -15."
      - name: begruendung_kurz
        description: "Kurze Begründung der Bewertung in einer Zeile (Themen-Treffer, Region, Alter, Reaktionen, Konzern, Negativbegriff)."
      - name: themen
        description: "Gefundene Themen mit Begriff, z. B. 'BI und Reporting: power bi (Titel)'; (Titel) = Treffer im Stellentitel. Leer ohne Treffer."
      - name: titel
        description: "Stellentitel bzw. Auftragstitel der Anzeige."
      - name: text
        description: "Beschreibungstext der Anzeige (auf 4.000 Zeichen gekürzt; aus Detailseite, Auftragsbeschreibung oder Kurztext, je nach Quelle). Kann leer sein."
      - name: url
        description: "Link zur Anzeige bzw. zum Auftrag."
      - name: quellen
        description: "Quellen, in denen die Gelegenheit gefunden wurde (karriere, theirstack, website, freelancer, adzuna, ted), kommagetrennt."
      - name: firma_name
        description: "Name der Firma (Arbeitgeber/Auftraggeber). Bei TED der Auftraggeber, bei freelancer.at meist leer oder 'UNKNOWN'."
      - name: ist_konzern
        description: "1 = Konzern oder Konzerntochter (über 2.500 Mitarbeiter, Konzernhinweis oder fremde Jobdomain im Impressum), sonst 0."
      - name: groesse
        description: "Größenklasse nach Mitarbeitern: 'unter 20', '20-500', '501-2500', 'ueber 2500'. Leer, wenn die Mitarbeiterzahl unbekannt ist."
      - name: mitarbeiter
        description: "Zahl der Mitarbeiter der Firma (aus TheirStack bzw. karriere.at; teils als Untergrenze der Spanne). Leer, wenn unbekannt."
      - name: technologien
        description: "Technologien der Firma laut TheirStack (kommagetrennt). Oft leer."
      - name: ort
        description: "Arbeitsort der Stelle (Text aus der Anzeige). Leer bei vielen Website-Stellen."
      - name: ort_quelle
        description: "Herkunft des Orts: 'stelle' (Ort aus der Anzeige), 'impressum' (Anzeige ohne Ort; Ersatz ist die PLZ aus dem Impressum der Firma) oder 'firmenbuch_sitz' (Ersatz ist der Sitz laut Firmenbuch). Beide Ersatzorte sind ungefähr und zählen in p_region nur halb."
      - name: plz
        description: "Postleitzahl des Arbeitsorts, wenn bekannt (oft leer)."
      - name: bundesland
        description: "Bundesland des Arbeitsorts (abgeleitet aus Ort/PLZ); 'mehrere' bei landesweiten oder bundeslandübergreifenden Angaben (z. B. 'Österreich'); leer, wenn nicht bestimmbar (z. B. Ausland, Remote ohne Ort)."
      - name: ist_remote
        description: "1 = reine Remote-Arbeit laut Anzeige, sonst 0."
      - name: ist_hybrid
        description: "1 = hybrides Arbeiten (Büro und Remote) laut Anzeige, sonst 0."
      - name: vertragsart
        description: "Vertragsart laut Anzeige: freiberuflich, projekt, befristet, unbefristet/vollzeit u. a. Leer, wenn nicht angegeben."
      - name: veroeffentlicht_am
        description: "Veröffentlichungsdatum der Anzeige; bei datum_geschaetzt = 1 ersatzweise das Datum der ersten Sichtung."
      - name: datum_geschaetzt
        description: "1 = veroeffentlicht_am ist geschätzt (erste Sichtung), 0 = Datum aus der Anzeige."
      - name: tage_online
        description: "Tage, die die Anzeige zwischen Veröffentlichung und letzter Sichtung online war."
      - name: reaktionen
        description: "Zahl der Reaktionen/Angebote auf einen Auftrag (nur freelancer.at); leer bei anderen Quellen."
      - name: budget
        description: "Budget bzw. Gehalt als Text laut Anzeige (z. B. '50–70 EUR/h'). Leer, wenn nicht genannt."
      - name: status
        description: "Lead-Status aus dem Suchprofil (beworben, kontaktiert, kein Fit, erledigt, offen). Leer = noch nicht bearbeitet."
      - name: status_am
        description: "Datum des Lead-Status."
      - name: ki_einstufung
        description: "Einstufung im jüngsten KI-Urteil: A (sofort angehen), B (interessant), C (beobachten), X (nicht passend). Leer = noch nicht bewertet. Live aus der Eingangstabelle gelesen."
      - name: ki_score
        description: "Score 0–100 im jüngsten KI-Urteil."
      - name: ki_begruendung
        description: "Begründung des KI-Urteils (Text)."
      - name: ki_anlass
        description: "Anlass bzw. Auslöser laut KI-Urteil (z. B. Frist, Neuausschreibung, Signal im Firmenbuch)."
      - name: ki_naechster_schritt
        description: "Empfohlener nächster Schritt: bewerben, anschreiben, linkedin, partner_fragen, beobachten, nichts."
      - name: ki_baustein
        description: "Textbaustein der KI für die Ansprache (Entwurf)."
      - name: ki_bewertet_am
        description: "Zeitpunkt des KI-Urteils (UTC)."

  - name: lead_firmen_v
    description: |
      Firmenblick: 1 Zeile je Firma (quellenübergreifend zusammengeführt) mit mindestens einer Gelegenheit in den letzten 30 Tagen. Zeigt den besten
      Vorscore, Zahl der Gelegenheiten, Themen, Regionen, Größe sowie Firmenbuch-Daten (FN, Rechtsform, Sitz, Veränderungen) und Kennzahlen des
      Jahresabschlusses. Blättern über firma_id (varchar, eindeutig).
    columns:
      - name: firma_id
        description: "Eindeutiger Schlüssel der Firma (Text, Hash von master_firma_bk). Zum Blättern und für den Lead-Status verwenden."
        data_tests: [not_null, unique]
      - name: master_firma_bk
        description: "Fachlicher Schlüssel der zusammengeführten Firma: 'fn:<Firmenbuchnummer>' | 'd:<Domain>' | 'n:<normierter Name>' | '<quelle>:<id>'."
        data_tests: [not_null, unique]
      - name: firma_name
        description: "Name der Firma (aus der Gelegenheit mit dem besten Vorscore)."
      - name: bester_vorscore
        description: "Höchster Vorscore (0–100) der Gelegenheiten der Firma."
        data_tests: [not_null]
      - name: bester_lead_typ
        description: "Lead-Typ der besten Gelegenheit (A1, A2, A3, B1, B2, C; siehe lead_gelegenheiten_v.lead_typ)."
      - name: anzahl_gelegenheiten
        description: "Zahl der Gelegenheiten der Firma in den letzten 30 Tagen (ohne ausgeschlossene)."
      - name: anzahl_ab_40
        description: "Zahl der Gelegenheiten mit Vorscore ab 40."
      - name: themen
        description: "Themen über alle Stellen der Firma, kommagetrennt (Datenplattform, BI und Reporting, KI, Controlling, …)."
      - name: regionen
        description: "Bundesländer der Gelegenheiten, kommagetrennt."
      - name: region_beste
        description: "Bundesland der besten Gelegenheit."
      - name: groesse
        description: "Größenklasse nach Mitarbeitern: 'unter 20', '20-500', '501-2500', 'ueber 2500'. Leer, wenn unbekannt."
      - name: mitarbeiter
        description: "Mitarbeiterzahl (TheirStack/karriere.at; teils Untergrenze einer Spanne). Leer, wenn unbekannt."
      - name: ist_konzern
        description: "1 = Konzern oder Konzerntochter, sonst 0."
      - name: ist_vermittler
        description: "1 = Personalvermittler/Recruiting-Agentur, sonst 0."
      - name: branche
        description: "Branche laut TheirStack."
      - name: technologien
        description: "Technologien der Firma laut TheirStack (kommagetrennt)."
      - name: fn
        description: "Firmenbuchnummer (ohne führende Nullen, z. B. 88983h). Leer, wenn die Firma nicht sicher zugeordnet ist."
      - name: rechtsform
        description: "Rechtsform laut Firmenbuch (z. B. Gesellschaft mit beschränkter Haftung)."
      - name: firmenbuch_sitz
        description: "Sitz der Firma laut Firmenbuch."
      - name: geschaeftsfuehrung
        description: "Geschäftsführung laut Firmenbuch-Auszug (Geschäftsführer, Vorstand, Geschäftsleiter, Komplementäre): 'Name (Funktion, seit Datum) | …'. Ohne Geburtsdatum. Leer, wenn die Firma nicht sicher zugeordnet ist oder kein Auszug vorliegt."
      - name: anzahl_prokuristen
        description: "Zahl der Prokuristen laut Firmenbuch-Auszug (0, wenn keine oder unbekannt)."
      - name: groessenklasse
        description: "Größenklasse laut jüngstem Jahresabschluss: klein, mittel, gross; 'unbekannt' bei sonstigen Codes. Leer ohne Jahresabschluss."
      - name: abschluss_stichtag
        description: "Stichtag des jüngsten Jahresabschlusses."
      - name: bilanzsumme
        description: "Bilanzsumme in EUR laut jüngstem Jahresabschluss."
      - name: umsatzerloese
        description: "Umsatzerlöse in EUR; nur bei mittleren und großen Firmen offengelegt, sonst leer."
      - name: eigenkapital
        description: "Eigenkapital in EUR laut jüngstem Jahresabschluss."
      - name: jahresergebnis
        description: "Jahresüberschuss bzw. -fehlbetrag in EUR; nur bei mittleren und großen Firmen offengelegt, sonst leer."
      - name: mitarbeiter_abschluss
        description: "Durchschnittliche Mitarbeiterzahl laut Anhang des Jahresabschlusses; nur bei kleinen Firmen offengelegt, sonst leer."
      - name: quellen
        description: "Quellen der Gelegenheiten der Firma, kommagetrennt."
      - name: erste_sichtung
        description: "Datum der ersten Sichtung einer Gelegenheit der Firma."
      - name: letzte_sichtung
        description: "Datum der letzten Sichtung."
      - name: beste_gelegenheiten
        description: "Bis zu fünf beste Gelegenheiten als Text: 'Titel [Typ Vorscore] | …', beste zuerst."
      - name: firmenbuch_ereignisse
        description: "Jüngste Veränderung im Firmenbuch als Text (Art, Datum, Anzahl im Zeitraum). Leer, wenn keine bekannt."
      - name: status
        description: "Lead-Status der Firma aus dem Suchprofil (beworben, kontaktiert, kein Fit, erledigt). Leer = unbearbeitet."
      - name: status_am
        description: "Datum des Lead-Status."
      - name: ki_einstufung_beste
        description: "Beste KI-Einstufung (A vor B vor C vor X) über die bewerteten Gelegenheiten der Firma. Leer, wenn keine bewertet ist."
      - name: ki_anzahl_a
        description: "Zahl der Gelegenheiten der Firma mit KI-Einstufung A."

  - name: lead_ki_offen_v
    description: |
      Arbeitsliste für die KI-Bewertung: Gelegenheiten mit Vorscore ab 40, die noch kein KI-Urteil haben (grund 'neu') oder seit dem letzten
      Urteil inhaltlich geändert wurden (grund 'geaendert'); ohne Status kein fit/erledigt. Nach vorscore absteigend abrufen. Blättern über gelegenheit_id.
    columns:
      - name: gelegenheit_id
        description: "Eindeutiger Schlüssel der Gelegenheit (Text); derselbe wie in lead_gelegenheiten_v. Damit das Urteil in die Eingangstabelle schreiben."
        data_tests: [not_null, unique]
      - name: vorscore
        description: "Vorbewertung 0–100 (siehe lead_gelegenheiten_v)."
        data_tests: [not_null]
      - name: lead_typ
        description: "Art des Leads: A1 freelancer.at | A2 Projekt über Vermittler | A3 Ausschreibung (TED) | B1 Überbrückungsbedarf | B2 sonstige Firmenstelle | C Partner."
      - name: titel
        description: "Stellen- bzw. Auftragstitel."
      - name: url
        description: "Link zur Anzeige."
      - name: text
        description: "Beschreibungstext der Anzeige (auf 4.000 Zeichen gekürzt). Kann leer sein."
      - name: firma_name
        description: "Name der Firma (Arbeitgeber/Auftraggeber)."
      - name: firma_id
        description: "Schlüssel der Firma wie in lead_firmen_v (Text). Leer bei Gelegenheiten ohne bekannte Firma."
      - name: ort
        description: "Arbeitsort laut Anzeige."
      - name: ort_quelle
        description: "Herkunft des Orts: 'stelle' (Ort aus der Anzeige), 'impressum' (Anzeige ohne Ort; Ersatz ist die PLZ aus dem Impressum der Firma) oder 'firmenbuch_sitz' (Ersatz ist der Sitz laut Firmenbuch). Beide Ersatzorte sind ungefähr und zählen in p_region nur halb."
      - name: bundesland
        description: "Bundesland des Arbeitsorts; 'mehrere' bei landesweiten oder bundeslandübergreifenden Angaben; leer, wenn nicht bestimmbar."
      - name: ist_remote
        description: "1 = Remote laut Anzeige, sonst 0."
      - name: veroeffentlicht_am
        description: "Veröffentlichungsdatum (ersatzweise erste Sichtung)."
      - name: begruendung_kurz
        description: "Kurze Begründung des Vorscores."
      - name: p_thema
        description: "Baustein Thema 0–35."
      - name: p_typ
        description: "Baustein Lead-Typ."
      - name: p_region
        description: "Baustein Region 0–20."
      - name: p_frische
        description: "Baustein Frische 0–15."
      - name: p_passung
        description: "Baustein Passung 0–5 (Stundensatz/Budget, Firmengröße)."
      - name: p_bonus
        description: "Baustein Bonus bis +15."
      - name: p_abzug
        description: "Baustein Abzug bis -25."
      - name: groesse
        description: "Größenklasse nach Mitarbeitern: 'unter 20', '20-500', '501-2500', 'ueber 2500'. Leer, wenn unbekannt."
      - name: ist_konzern
        description: "1 = Konzern oder Konzerntochter, sonst 0."
      - name: geschaeftsfuehrung
        description: "Geschäftsführung laut Firmenbuch-Auszug (Geschäftsführer, Vorstand, Geschäftsleiter, Komplementäre): 'Name (Funktion, seit Datum) | …'. Ohne Geburtsdatum. Leer, wenn die Firma nicht sicher zugeordnet ist oder kein Auszug vorliegt."
      - name: anzahl_prokuristen
        description: "Zahl der Prokuristen laut Firmenbuch-Auszug (0, wenn keine oder unbekannt)."
      - name: groessenklasse
        description: "Größenklasse laut jüngstem Jahresabschluss: klein, mittel, gross; 'unbekannt' bei sonstigen Codes. Leer ohne Jahresabschluss."
      - name: groessenklasse_code
        description: "Code aus den Metadaten des Jahresabschlusses (K klein, M mittel, G groß; W und N ungeklärt, werden neutral bewertet)."
      - name: abschluss_stichtag
        description: "Stichtag des jüngsten Jahresabschlusses."
      - name: bilanzsumme
        description: "Bilanzsumme in EUR."
      - name: umsatzerloese
        description: "Umsatzerlöse in EUR; nur bei mittleren und großen Firmen offengelegt."
      - name: eigenkapital
        description: "Eigenkapital in EUR."
      - name: jahresergebnis
        description: "Jahresüberschuss bzw. -fehlbetrag in EUR; nur bei mittleren und großen Firmen offengelegt."
      - name: mitarbeiter_abschluss
        description: "Durchschnittliche Mitarbeiterzahl laut Anhang; nur bei kleinen Firmen offengelegt."
      - name: fn
