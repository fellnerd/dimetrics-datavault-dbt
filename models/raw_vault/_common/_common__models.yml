version: 2

models:
  - name: hub_stelle
    description: "Hub Stelle (Stellenanzeige), quellenuebergreifend. BK: collision_code + stelle_bk."
    columns:
      - name: hk_stelle
        data_type: "CHAR(64)"
        data_tests: [not_null, unique]
      - name: stelle_bk
        data_tests: [not_null]
      - name: dss_business_key
        data_tests: [not_null]
      - name: dss_load_date
        data_type: "DATETIME2(6)"
      - name: dss_record_source
        data_type: "VARCHAR(50)"

  - name: hub_firma
    description: "Hub Firma, quellenuebergreifend. BK: collision_code + firma_bk ('-1' = unbekannt)."
    columns:
      - name: hk_firma
        data_type: "CHAR(64)"
        data_tests: [not_null, unique]
      - name: firma_bk
        data_tests: [not_null]
      - name: dss_business_key
        data_tests: [not_null]
      - name: dss_load_date
        data_type: "DATETIME2(6)"
      - name: dss_record_source
        data_type: "VARCHAR(50)"

  - name: link_stelle_firma
    description: "Link Stelle - Firma."
    columns:
      - name: hk_link_stelle_firma
        data_type: "CHAR(64)"
        data_tests: [not_null, unique]
      - name: hk_stelle
        data_tests: [not_null]
      - name: hk_firma
        data_tests: [not_null]

  - name: sat_stelle__karriere
    description: "Attribute der Stelle aus karriere.at."
    columns: &sat_stelle_columns
      - name: hk_stelle
        data_tests: [not_null]
      - name: hashdiff
        data_tests: [not_null]

  - name: sat_stelle__theirstack
    description: "Attribute der Stelle aus TheirStack."
    columns: *sat_stelle_columns

  - name: sat_stelle__website
    description: "Attribute der Stelle von Firmenwebsites (Titel, URL)."
    columns: *sat_stelle_columns

  - name: sat_firma__karriere
    description: "Firmenattribute aus karriere.at."
    columns: &sat_firma_columns
      - name: hk_firma
        data_tests: [not_null]
      - name: hashdiff
        data_tests: [not_null]

  - name: sat_firma__theirstack
    description: "Firmenattribute aus TheirStack."
    columns: *sat_firma_columns

  - name: sat_stelle_sichtung__karriere
    description: "Sichtungs-Satellit: je Lauf eine Zeile (zuletzt gesehen / nicht mehr online), Quelle karriere."
    columns: *sat_stelle_columns

  - name: sat_stelle_sichtung__theirstack
    description: "Sichtungs-Satellit, Quelle TheirStack."
    columns: *sat_stelle_columns

  - name: sat_stelle_sichtung__website
    description: "Sichtungs-Satellit, Quelle Website."
    columns: *sat_stelle_columns

  - name: sat_stelle__freelancer
    description: "Attribute der Stelle (Auftrag) von freelancer.at: Titel, URL, Beschreibung, Kategorie, Budget, Ort, Status."
    columns: *sat_stelle_columns

  - name: sat_stelle_sichtung__freelancer
    description: "Sichtungs-Satellit, Quelle freelancer.at."
    columns: *sat_stelle_columns

  - name: sat_firma__firmenprofil
    description: "Firmenattribute aus dem Firmenprofil der Quelle (Name, Profil-URL, Website)."
    columns: *sat_firma_columns

  - name: sat_stelle__adzuna
    description: "Attribute der Stelle von Adzuna: Titel, Beschreibung (Auszug), Ort, Kategorie, Gehalt, Vertrag, URL."
    columns: *sat_stelle_columns

  - name: sat_firma__adzuna
    description: "Firmenattribute aus Adzuna (nur der Name; BK ist der normierte Name)."
    columns: *sat_firma_columns

  - name: sat_stelle_sichtung__adzuna
    description: "Sichtungs-Satellit, Quelle Adzuna (jede Anzeige nur einmal, im Lauf nach ihrem Erscheinen)."
    columns: *sat_stelle_columns

  - name: sat_stelle__karriere_text
    description: "Kurztext (summary) der karriere.at-Stelle aus den Suchergebnissen."
    columns: *sat_stelle_columns
  - name: sat_stelle__theirstack_detail
    description: "TheirStack-Stelle: Beschreibung, Bundesland/Land, Koordinaten, Kurzort, reposted, Beschäftigungsarten, Keywords."
    columns: *sat_stelle_columns
  - name: sat_firma__theirstack_detail
    description: "TheirStack-Firma: Ort, PLZ, Land, Technologien, Branche-ID (ohne num_jobs_last_30_days)."
    columns: *sat_firma_columns
  - name: sat_stelle__freelancer_detail
    description: "freelancer.at: normalisierte Felder (payload.norm): Veröffentlichung, Änderung, Reaktionen, remote, Ort, Land, Budget min/max/Einheit."
    columns: *sat_stelle_columns

  - name: sat_firma__website
    description: "Firmenname aus payload.company.name der Website-Datei (ersetzt 'UNKNOWN' bei Domain-Firmen)."
    columns: *sat_firma_columns

  - name: sat_firma__impressum
    description: "Impressum der Firma (Website): Firmenbuchnummer, UID, PLZ, Ort, Firmenname, Konzernhinweis, fremde Jobdomain."
    columns: *sat_firma_columns
  - name: sat_stelle__karriere_detail
    description: "Detailseite der karriere.at-Stelle: Beschreibung, Veröffentlichung, gültig bis, Beschäftigungsart, Orte, PLZ, Region, Land, Gehalt."
    columns:
      - name: hk_stelle
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('hub_stelle'), field: hk_stelle}
              config: {severity: warn}
      - name: hashdiff
        data_tests: [not_null]

  - name: sat_stelle__ted
    description: "TED-Bekanntmachung: Titel, Art, Auftraggeber (Name, Ort), Veröffentlichung, Frist, Beschreibung, Ausführungsort, CPV, URL."
    columns: *sat_stelle_columns
  - name: sat_stelle_sichtung__ted
    description: "Sichtungs-Satellit, Quelle TED (jede Bekanntmachung wird in jedem Lauf erneut gelistet)."
    columns: *sat_stelle_columns

  - name: sat_firma__firmenbuch
    description: "Firmenbuch (nur sichere Zuordnungen): Firmenbuchnummer (normalisiert), Name, Sitz, Rechtsform, Gericht, Status."
    columns: *sat_firma_columns
  - name: sat_firma__firmenbuch_ereignis
    description: "Signal-Satellit: Veränderungen im Firmenbuch je Firma und Zeitraum (Anzahl, jüngstes Datum, jüngste Art, Arten)."
    columns: *sat_firma_columns
